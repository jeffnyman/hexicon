[workspace]
resolver = "3"
members = [
    "crates/hexicon-image",
    "crates/hexicon-bytecode",
    "crates/hexicon-decimal",
    "crates/hexicon-host",
    "crates/hexicon-vm",
    "crates/hexicon-compiler",
    "crates/hexicon-cli",
    "crates/hexicon-wasm",
    "crates/hexicon-fuzz",
    "crates/hexicon-app",
]
# The player is built on its own (tools/build-app.sh), after the web page it
# shows: it needs the page's WebAssembly build, and the system's web view.
default-members = [
    "crates/hexicon-image",
    "crates/hexicon-bytecode",
    "crates/hexicon-decimal",
    "crates/hexicon-host",
    "crates/hexicon-vm",
    "crates/hexicon-compiler",
    "crates/hexicon-cli",
    "crates/hexicon-wasm",
    "crates/hexicon-fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/jeffnyman/hexicon"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
