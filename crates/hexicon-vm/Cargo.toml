[package]
name = "hexicon-vm"
description = "The Hexicon virtual machine: runs the games Hexicon builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# A sampling profiler; see src/prof.rs.
profile = []

[dependencies]
hexicon-bignum = { path = "../hexicon-bignum" }
hexicon-bytecode = { path = "../hexicon-bytecode" }
# The compiler, for code compiled while a program runs: no libraries
# built in, which only building a game needs.
hexicon-compiler = { path = "../hexicon-compiler", default-features = false }
hexicon-host = { path = "../hexicon-host" }
hexicon-image = { path = "../hexicon-image" }

[lints]
workspace = true
