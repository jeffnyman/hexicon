[package]
name = "hexicon-cli"
description = "Command-line tools for Hexicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "hexicon"
path = "src/main.rs"

[features]
# Build the VM with its sampling profiler, which reports when a game ends.
profile = ["hexicon-vm/profile"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
hexicon-bytecode = { path = "../hexicon-bytecode" }
hexicon-compiler = { path = "../hexicon-compiler" }
hexicon-host = { path = "../hexicon-host" }
hexicon-image = { path = "../hexicon-image" }
hexicon-vm = { path = "../hexicon-vm" }

[lints]
workspace = true
