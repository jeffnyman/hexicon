[package]
name = "hexicon-app"
description = "Hexicon's player: a window that plays games, with the web page's display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "hexicon-player"
path = "src/main.rs"

[dependencies]
# The window, and the system's web view in it: WebView2 on Windows, WebKit
# on macOS and Linux.
tao = "0.38"
wry = "0.58"
# The games' files, carried between the page and the folder as text, and
# the user's folders.
base64 = "0.23"
dirs = "7"
# The system's own dialog for a file the game asks for. On Linux it is
# GTK's, which the web view needs already.
rfd = { version = "0.18", default-features = false, features = ["gtk3"] }

# The menu bar a Mac program has, where Quit, and Cut, Copy, and Paste,
# are, with their keys.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.22", default-features = false }

[lints]
workspace = true
