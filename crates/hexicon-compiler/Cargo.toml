[package]
name = "hexicon-compiler"
description = "The Hexicon compiler: source text to a program image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["built-in-libraries"]
# The system library and Hexad, built into the compiler (lib/system,
# lib/hexad), so that a game builds with nothing else installed.
built-in-libraries = []

[dependencies]
hexicon-decimal = { path = "../hexicon-decimal" }
hexicon-bytecode = { path = "../hexicon-bytecode" }
toml = { version = "1.2.2", default-features = false, features = ["parse", "preserve_order", "serde", "std"] }

[lints]
workspace = true
