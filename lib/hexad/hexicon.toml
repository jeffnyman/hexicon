# Hexad, the library for Hexicon games.
#
# Hexad begins as adv3Lite 2.2.3.2, by Eric Eve (see LICENSE.MD), and
# these are its sources in adv3Lite's order. A source named with ".t" is
# still TADS 3; one with no extension is a Hexicon (.hxn) source.

[library]
name = "Hexad"
sources = [
    "actions.t",
    "action.t",
    "banner.t",
    "command.t",
    "console.t",
    "debug.t",
    "debug_dynfunc.t",
    "doer.t",
    "input.t",
    "lister.t",
    "main.t",
    "messages.t",
    "misc.t",
    "modid.t",
    "output.t",
    "parser.t",
    "precond.t",
    "query.t",
    "spelling.t",
    "status.t",
    "thing.t",
    "travel.t",
    "actor.t",
    "attachables.t",
    "events.t",
    "eventList.t",
    "exits.t",
    "extras.t",
    "gadget.t",
    "menusys.t",
    "menucon.t",
    "hintsys.t",
    "pathfind.t",
    "remapcmd.t",
    "scene.t",
    "scenery.t",
    "score.t",
    "senseRegion.t",
    "topicEntry.t",
    "thoughts.t",
    "facts.t",
]
libraries = ["$(LANGUAGE)"]

[needs]
LANGUAGE = "this selects the language the library uses in its messages and parsing; for English, use \"english\""
