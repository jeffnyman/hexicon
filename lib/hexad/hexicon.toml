# Hexad, the library for Hexicon games.
#
# These are its sources, in the order they are built. A source named
# with ".t" is still TADS 3; one with no extension is a Hexicon (.hxn)
# source.

[library]
name = "Hexad"
# What a Hexicon source gets by importing Hexad (`import hexad;`).
header = "hexad.h"
sources = [
    "actions",
    "action",
    "banner",
    "command",
    "console",
    "debug",
    "debug_dynfunc",
    "doer",
    "input",
    "lister",
    "main",
    "messages",
    "misc",
    "modid",
    "output",
    "parser",
    "precond",
    "query",
    "spelling",
    "status",
    "thing",
    "travel",
    "actor",
    "attachables",
    "events",
    "eventList",
    "exits",
    "extras",
    "gadget",
    "menusys",
    "menucon",
    "hintsys",
    "pathfind",
    "remapcmd",
    "scene",
    "scenery",
    "score",
    "senseRegion",
    "topicEntry",
    "thoughts",
    "facts",
]
libraries = ["$(LANGUAGE)"]

[needs]
LANGUAGE = "this selects the language the library uses in its messages and parsing; for English, use \"english\""
